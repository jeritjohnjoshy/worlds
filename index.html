<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anniversary Adventure</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #ffccf2; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* HUD */
        #hud-top { position: absolute; top: 20px; left: 0; width: 100%; text-align: center; color: #d63384; font-weight: bold; font-size: 1.2rem; text-shadow: 1px 1px 2px white; pointer-events: auto; }
        
        /* Controls */
        #joystick-area { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: auto; border: 2px solid #ff99cc; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 40px; height: 40px; background: #d63384; border-radius: 50%; pointer-events: none; }
        
        #look-area { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; pointer-events: auto; }
        
        #action-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: #d63384; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid white; user-select: none; }
        #action-btn:active { transform: scale(0.9); }

        #collect-btn { position: absolute; bottom: 140px; right: 20px; padding: 15px 20px; background: #ff4d94; color: white; border-radius: 20px; font-weight: bold; font-size: 1.1rem; pointer-events: auto; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid white; text-align: center; }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: rgba(255,255,255,0.8); border: 2px solid #d63384; border-radius: 50%; transform: translate(-50%, -50%); }

        /* Pocket Inventory */
        #pocket { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; pointer-events: auto; }
        .pocket-slot { width: 40px; height: 50px; background: rgba(255,255,255,0.5); border: 2px dashed #d63384; border-radius: 5px; background-size: cover; background-position: center; }

        /* Celebration Screen */
        #celebration { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 204, 242, 0.95); z-index: 10; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #d63384; padding: 20px; box-sizing: border-box; }
        #celebration h1 { font-size: 2.5rem; margin-bottom: 10px; }
        #celebration p { font-size: 1.2rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="hud-top">Memories Pocketed: <span id="score">0</span> / 6</div>
        <div id="pocket">
            <div class="pocket-slot" id="slot-0"></div>
            <div class="pocket-slot" id="slot-1"></div>
            <div class="pocket-slot" id="slot-2"></div>
            <div class="pocket-slot" id="slot-3"></div>
            <div class="pocket-slot" id="slot-4"></div>
            <div class="pocket-slot" id="slot-5"></div>
        </div>
        <div id="crosshair"></div>
        <div id="look-area"></div>
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <div id="action-btn">CHISEL</div>
        <div id="collect-btn">⬇️ Collect in Pocket</div>
    </div>

    <div id="celebration">
        <h1>Happy Anniversary! 💖</h1>
        <p>I loved uncovering every single memory with you. You are my world.</p>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. Basic Setup & Pink Theme ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffe6f2); // Soft pink sky
        scene.fog = new THREE.FogExp2(0xffe6f2, 0.03); // Pink fog

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); // Human eye height

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffb3d9, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // Floor
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xffb3d9, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- 2. Game Logic & Assets ---
        // Ensure these exact files are in the same folder as this index.html on GitHub!
        const imageFiles = ['image1.jpg', 'image2.jpg', 'image3.jpg', 'image4.jpg', 'image5.jpg', 'image6.jpg'];
        const textureLoader = new THREE.TextureLoader();
        const nodes = [];
        let score = 0;
        let targetedNode = null;

        // Particle System for Chiseling
        const particles = [];
        const particleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const particleMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 1.0 });

        function createParticles(position) {
            for(let i=0; i<8; i++) {
                const mesh = new THREE.Mesh(particleGeo, particleMat);
                mesh.position.copy(position);
                mesh.position.x += (Math.random() - 0.5);
                mesh.position.y += (Math.random() - 0.5);
                mesh.position.z += (Math.random() - 0.5);
                
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.2,
                    Math.random() * 0.2,
                    (Math.random() - 0.5) * 0.2
                );
                
                scene.add(mesh);
                particles.push({ mesh, velocity, life: 1.0 });
            }
        }

        // Generate Memory Nodes
        imageFiles.forEach((file, index) => {
            const group = new THREE.Group();
            
            // The texture loads immediately and is applied to the hidden geometry
            const texture = textureLoader.load(file);
            texture.encoding = THREE.sRGBEncoding;

            // The Inner Photo (rendered smaller, inside the rock)
            const photoGeo = new THREE.PlaneGeometry(2.5, 3.5);
            const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const photoMesh = new THREE.Mesh(photoGeo, photoMat);
            photoMesh.scale.setScalar(0.5); // Shrink to fit inside
            group.add(photoMesh);

            // The Outer Rock (Complex Dodecahedron)
            const rockGeo = new THREE.DodecahedronGeometry(2, 1);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.9, flatShading: true });
            const rockMesh = new THREE.Mesh(rockGeo, rockMat);
            group.add(rockMesh);

            // Position in a circle around spawn
            const angle = (index / imageFiles.length) * Math.PI * 2;
            const radius = 12;
            group.position.set(Math.cos(angle) * radius, 1.5, Math.sin(angle) * radius);
            
            group.userData = { 
                health: 4, 
                revealed: false,
                rock: rockMesh, 
                photo: photoMesh,
                imgSrc: file
            };
            
            scene.add(group);
            nodes.push(group);
        });

        // --- 3. Interaction Mechanics ---
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0); // Always casting from center
        const actionBtn = document.getElementById('action-btn');
        const collectBtn = document.getElementById('collect-btn');
        const scoreSpan = document.getElementById('score');

        actionBtn.addEventListener('pointerdown', () => {
            if (targetedNode && !targetedNode.userData.revealed) {
                const data = targetedNode.userData;
                data.health -= 1;
                
                // Emits debris
                createParticles(targetedNode.position);
                
                // Shrink rock slightly to simulate chiseling
                data.rock.scale.multiplyScalar(0.85);

                if (data.health <= 0) {
                    // Reveal the photo!
                    data.rock.visible = false;
                    data.photo.scale.setScalar(1.0); // Grow photo to full size
                    data.revealed = true;
                    actionBtn.style.display = 'none';
                    collectBtn.style.display = 'block';
                }
            }
        });

        collectBtn.addEventListener('pointerdown', () => {
            if (targetedNode && targetedNode.userData.revealed) {
                // Add to HTML pocket
                document.getElementById(`slot-${score}`).style.backgroundImage = `url(${targetedNode.userData.imgSrc})`;
                
                // Remove from 3D scene
                scene.remove(targetedNode);
                nodes.splice(nodes.indexOf(targetedNode), 1);
                targetedNode = null;
                
                score++;
                scoreSpan.innerText = score;
                
                collectBtn.style.display = 'none';
                actionBtn.style.display = 'flex';

                if (score >= 6) {
                    triggerCelebration();
                }
            }
        });

        function triggerCelebration() {
            document.getElementById('celebration').style.display = 'flex';
            // Make scene bright and beautiful
            scene.background = new THREE.Color(0xffffff);
            scene.fog.color.setHex(0xffffff);
            ambientLight.intensity = 1.5;
        }

        // --- 4. Mobile Controls ---
        let moveJoystick = { active: false, x: 0, y: 0, originX: 0, originY: 0 };
        let lookTouch = { active: false, id: null, lastX: 0, lastY: 0 };
        
        let pitch = 0;
        let yaw = 0;

        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');
        const lookArea = document.getElementById('look-area');

        // Joystick Movement
        joystickArea.addEventListener('pointerdown', (e) => {
            moveJoystick.active = true;
            const rect = joystickArea.getBoundingClientRect();
            moveJoystick.originX = rect.left + rect.width / 2;
            moveJoystick.originY = rect.top + rect.height / 2;
            updateJoystick(e);
        });

        window.addEventListener('pointermove', (e) => {
            if (moveJoystick.active) {
                updateJoystick(e);
            }
        });

        window.addEventListener('pointerup', () => {
            moveJoystick.active = false;
            moveJoystick.x = 0;
            moveJoystick.y = 0;
            joystickKnob.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(e) {
            let dx = e.clientX - moveJoystick.originX;
            let dy = e.clientY - moveJoystick.originY;
            const maxRadius = 40;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveJoystick.x = dx / maxRadius;
            moveJoystick.y = dy / maxRadius;
        }

        // Swipe to Look
        lookArea.addEventListener('touchstart', (e) => {
            if (!lookTouch.active) {
                lookTouch.active = true;
                lookTouch.id = e.changedTouches[0].identifier;
                lookTouch.lastX = e.changedTouches[0].pageX;
                lookTouch.lastY = e.changedTouches[0].pageY;
            }
        });

        lookArea.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouch.id) {
                    const dx = e.changedTouches[i].pageX - lookTouch.lastX;
                    const dy = e.changedTouches[i].pageY - lookTouch.lastY;
                    
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
                    
                    lookTouch.lastX = e.changedTouches[i].pageX;
                    lookTouch.lastY = e.changedTouches[i].pageY;
                }
            }
        });

        lookArea.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouch.id) {
                    lookTouch.active = false;
                }
            }
        });

        // --- 5. Game Loop ---
        const clock = new THREE.Clock();
        const moveSpeed = 5;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Handle Camera Look
            camera.rotation.set(0, 0, 0);
            camera.rotateY(yaw);
            camera.rotateX(pitch);

            // Handle Camera Move
            if (moveJoystick.active) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();

                camera.position.addScaledVector(forward, -moveJoystick.y * moveSpeed * delta);
                camera.position.addScaledVector(right, moveJoystick.x * moveSpeed * delta);
            }

            // Animate Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.velocity);
                p.velocity.y -= 0.01; // Gravity
                p.life -= delta * 1.5;
                p.mesh.scale.setScalar(Math.max(0, p.life));
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            // Raycast to detect nearest rock
            raycaster.setFromCamera(centerScreen, camera);
            let closestNode = null;
            let closestDist = 5; // Interaction range

            nodes.forEach(group => {
                // Spin revealed photos
                if (group.userData.revealed) {
                    group.userData.photo.rotation.y += 1.5 * delta;
                } else {
                    // Bob floating rocks slightly
                    group.position.y = 1.5 + Math.sin(Date.now() * 0.002 + group.id) * 0.1;
                }

                // Check distance for interaction
                const dist = camera.position.distanceTo(group.position);
                if (dist < closestDist) {
                    // Raycast against the group's children to see if we are looking at it
                    const intersects = raycaster.intersectObjects(group.children);
                    if (intersects.length > 0) {
                        closestNode = group;
                        closestDist = dist;
                    }
                }
            });

            // Update UI based on targeting
            if (closestNode !== targetedNode) {
                if (closestNode) {
                    if (closestNode.userData.revealed) {
                        actionBtn.style.display = 'none';
                        collectBtn.style.display = 'block';
                    } else {
                        actionBtn.style.display = 'flex';
                        collectBtn.style.display = 'none';
                    }
                } else {
                    actionBtn.style.display = 'none';
                    collectBtn.style.display = 'none';
                }
                targetedNode = closestNode;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hide action button initially
        actionBtn.style.display = 'none';

        animate();
    </script>
</body>
</html>
